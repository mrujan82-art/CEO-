<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#071524" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef8fd" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Archipelago">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<script>
(function(){var h=document.documentElement,ua=navigator.userAgent||"";
function dev(){var w=innerWidth,c=matchMedia("(pointer:coarse)").matches;
 h.dataset.device=w<=820?"phone":(c&&w<=1180?"tablet":"desktop");h.dataset.input=c?"touch":"mouse";}
dev();addEventListener("resize",dev);
h.dataset.os=(/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))?"ios":(/Android/.test(ua)?"android":"other");
h.dataset.mode=(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true)?"standalone":"browser";
var c=navigator.connection||{};
var low=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=4)||c.saveData||/2g/.test(c.effectiveType||"");
h.dataset.perf=low?"low":"high";})();
</script>
<title>Archipelago</title>
<meta name="description" content="Archipelago">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#071524; --bg2:#0b2236; --ink:#e8f6ff; --muted:#8fb0c4;
  --ice:#9fe3ff; --glow:#4cc9f0; --line:rgba(159,227,255,.2);
  --panel:rgba(159,227,255,.06);
  --display:"Cormorant Garamond","Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#eef8fd; --bg2:#d9eef9; --ink:#0a2236; --muted:#46687e;
    --ice:#1c86b8; --glow:#1c86b8; --line:rgba(10,34,54,.18);
    --panel:rgba(10,34,54,.04);
  }
}
:root[data-theme="light"]{
  --bg:#eef8fd; --bg2:#d9eef9; --ink:#0a2236; --muted:#46687e;
  --ice:#1c86b8; --glow:#1c86b8; --line:rgba(10,34,54,.18);
  --panel:rgba(10,34,54,.04);
}
:root[data-theme="dark"]{
  --bg:#071524; --bg2:#0b2236; --ink:#e8f6ff; --muted:#8fb0c4;
  --ice:#9fe3ff; --glow:#4cc9f0; --line:rgba(159,227,255,.2);
  --panel:rgba(159,227,255,.06);
}
html{height:100%;overflow-x:clip;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:clip;
}
html[lang="ar"]{--display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
html[lang="ar"] body{line-height:1.9}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,48px)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--hdr);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;min-height:64px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em}
.mark .coin{width:40px;height:40px;border-radius:50%;animation:coinpulse 3.2s ease-in-out infinite}
nav{margin-inline-start:auto;display:flex;gap:26px}
nav a{color:var(--muted);text-decoration:none;font-size:.95rem;font-weight:500}
nav a:hover,nav a:focus-visible{color:var(--ink)}
select{
  appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;padding:7px 34px 7px 14px;font:inherit;font-size:.9rem;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
select option{color:#0a2236;background:#fff}
html[dir="rtl"] select{padding:7px 14px 7px 34px;background-position:17px 55%,12px 55%}
a:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:6px}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:clamp(20px,5vw,64px);padding:clamp(48px,9vw,110px) 0 clamp(56px,9vw,110px);position:relative}
.hero::before{content:"";position:absolute;inset:-10% -30% auto auto;width:70%;height:90%;background:radial-gradient(closest-side,rgba(76,201,240,.3),transparent 70%);filter:blur(10px);z-index:-1}
html[dir="rtl"] .hero::before{inset:-10% auto auto -10%;width:60%}
h1{font-family:var(--display);font-weight:600;font-size:clamp(2.7rem,4.5vw,4.6rem);line-height:.95;margin:0 0 .25em;letter-spacing:-.01em;
  background:linear-gradient(180deg,var(--ink) 20%,var(--ice) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang="ar"] h1{line-height:1.3;font-weight:700}
.tagline{font-family:var(--display);font-size:clamp(1.4rem,3vw,2rem);font-weight:500;margin:0 0 18px;color:var(--ice)}
html[lang="ar"] .tagline{font-weight:500}
.intro{max-width:46ch;color:var(--muted);margin:0 0 30px}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:linear-gradient(135deg,#bff0ff,#4cc9f0);color:#04243a;font-weight:600;text-decoration:none;font-size:.97rem;box-shadow:0 8px 30px -8px rgba(76,201,240,.7);transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.dragon{display:flex;justify-content:center}
.dragon svg{width:min(100%,460px);height:auto;filter:drop-shadow(0 0 28px rgba(76,201,240,.45));transform:scaleX(-1)}
html[dir="rtl"] .dragon svg{transform:none}
.breath{animation:breath 5s ease-in-out infinite}
.eye{animation:blink 6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,92%,100%{opacity:1}96%{opacity:.25}}

/* sections */
section{padding:clamp(48px,8vw,96px) 0;border-top:1px solid var(--line)}
h2{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4.5vw,3.1rem);line-height:1.1;margin:0 0 .6em}
html[lang="ar"] h2{line-height:1.4}
.about{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,6vw,80px)}
.about p{margin:0;font-size:1.12rem;max-width:60ch}
.focus-list{list-style:none;margin:0;padding:0}
.focus-list li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px;padding:26px 0;border-top:1px solid var(--line)}
.focus-list li:last-child{border-bottom:1px solid var(--line)}
.focus-list h3{margin:0;font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.2}
.focus-list p{margin:0;color:var(--muted);max-width:52ch}
.head-row{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:34px}

/* leadership */
.profile{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:clamp(28px,6vw,72px);align-items:start}
.photo{position:relative}
.photo::before{content:"";position:absolute;inset:-8px;background:linear-gradient(150deg,#e9fbff,#4cc9f0 45%,#1b5f94);clip-path:polygon(0 0,86% 0,100% 7%,100% 100%,14% 100%,0 93%);opacity:.9}
.photo img{position:relative;display:block;width:100%;aspect-ratio:3/4;object-fit:cover;clip-path:polygon(0 0,86% 0,100% 7%,100% 100%,14% 100%,0 93%);background:#fff}
html[dir="rtl"] .photo::before,html[dir="rtl"] .photo img{clip-path:polygon(14% 0,100% 0,100% 93%,86% 100%,0 100%,0 7%)}
.info h3.name{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05;margin:0 0 .35em;font-weight:600}
html[lang="ar"] .info h3.name{line-height:1.4}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;column-gap:28px}
dt,dd{padding:14px 0;border-top:1px solid var(--line);margin:0}
dl>:nth-last-child(-n+2){border-bottom:1px solid var(--line)}
dt{color:var(--muted);font-size:.95rem}
dd{font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rank{display:inline-block;padding:2px 14px;border-radius:999px;border:1px solid var(--glow);color:var(--ice);font-weight:600;letter-spacing:.06em}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1rem;letter-spacing:.04em;direction:ltr;unicode-bidi:isolate}
.flag{width:26px;height:17px;border-radius:2px;flex:none}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--muted);font-size:.9rem;position:relative;z-index:1}

@media (max-width:820px){
  nav{display:none}
  .bar{justify-content:space-between}
  .bar select{margin-inline-start:auto}
  .hero{grid-template-columns:1fr}
  .dragon{order:-1}
  .dragon svg{width:min(70%,300px)}
  .about,.focus-list li,.profile{grid-template-columns:1fr}
  .focus-list li{gap:6px}
  .photo{max-width:320px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* animated logo */
.hero{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
.art{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px -30px rgba(76,201,240,.55),0 0 0 6px rgba(76,201,240,.1);aspect-ratio:3/2;background:#050b1c;isolation:isolate}
.art-inner{position:absolute;inset:0;transform-origin:78% 58%;animation:kenburns 26s ease-in-out infinite alternate}
.art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.aurora{position:absolute;left:-12%;right:-12%;top:0;height:50%;mix-blend-mode:screen;pointer-events:none;filter:blur(16px);
  -webkit-mask-image:linear-gradient(to bottom,#000 5%,transparent 100%);mask-image:linear-gradient(to bottom,#000 5%,transparent 100%)}
.a1{background:linear-gradient(90deg,transparent 0%,rgba(60,255,190,.0) 15%,rgba(60,255,190,.5) 40%,rgba(120,110,255,.4) 62%,transparent 85%);animation:drift 13s ease-in-out infinite alternate}
.a2{background:linear-gradient(90deg,transparent 10%,rgba(150,90,255,.4) 35%,rgba(60,255,190,.42) 70%,transparent 95%);animation:drift 17s ease-in-out -6s infinite alternate-reverse}
.stars{position:absolute;inset:0 0 55% 0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,235,255,.9);animation:twinkle 3s ease-in-out infinite}
.lamp{position:absolute;width:var(--s,8%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,205,120,.85),rgba(255,160,50,0) 65%);animation:flick 3.4s ease-in-out infinite}
.coin-shine{position:absolute;left:80.1%;top:58.3%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;pointer-events:none;animation:coinglow 4.5s ease-in-out infinite}
.coin-shine::before{content:"";position:absolute;inset:-10% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,244,190,.85) 50%,transparent 58%);transform:translateX(-80%);animation:sweep 4.5s ease-in-out infinite;mix-blend-mode:overlay}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.09) translate(-1.5%,-1%)}}
@keyframes drift{from{transform:translateX(-5%) skewX(-5deg);opacity:.45}to{transform:translateX(5%) skewX(5deg);opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes flick{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}60%{opacity:.7}80%{opacity:.95}}
@keyframes sweep{0%,50%{transform:translateX(-80%)}100%{transform:translateX(80%)}}
@keyframes coinglow{0%,100%{box-shadow:0 0 12px 2px rgba(255,200,80,.35)}50%{box-shadow:0 0 34px 8px rgba(255,210,100,.7)}}
@keyframes coinpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,80,.0),0 0 10px rgba(255,200,80,.35)}50%{box-shadow:0 0 0 4px rgba(255,200,80,.12),0 0 20px rgba(255,210,100,.7)}}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}.art{order:-1}}

/* founder bio */
.bio{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,6vw,80px);margin-top:clamp(48px,7vw,88px);padding-top:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.bio h2{margin:0}
.bio p{margin:0 0 1em;font-size:1.12rem;max-width:60ch}
.stats{list-style:none;margin:28px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}
.stats li{padding:18px 12px 18px 0;display:flex;flex-direction:column;gap:4px}
html[dir="rtl"] .stats li{padding:18px 0 18px 12px}
.stats li+li{padding-inline-start:20px;border-inline-start:1px solid var(--line)}
.stats b{font-family:var(--display);font-size:clamp(2rem,4vw,3rem);line-height:1;font-weight:600;color:var(--ice);direction:ltr;unicode-bidi:isolate;text-align:start}
.stats span{color:var(--muted);font-size:.9rem;line-height:1.4}
.where{color:var(--muted);font-size:.95rem}
#places{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
#places li{padding:5px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:.95rem;background:var(--panel)}
@media (max-width:820px){.bio{grid-template-columns:minmax(0,1fr)}}

/* join */
.copy{font:inherit;font-size:.82rem;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ice);cursor:pointer}
.copy:hover{border-color:var(--glow)}
.join{margin-top:28px;padding:22px 24px;border:1px solid var(--line);border-inline-start:3px solid var(--glow);background:var(--panel);border-radius:6px 16px 16px 6px}
html[dir="rtl"] .join{border-radius:16px 6px 6px 16px}
.join p{margin:0 0 18px;max-width:52ch}

/* space */
.space-head{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:center}
.space-head h2{margin-top:0}
.space-head p{font-size:1.12rem;max-width:58ch;margin:0}
.orbit{display:flex;justify-content:center}
.orbit svg{width:100%;max-width:380px;height:auto}
.storm{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.atlas{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin:clamp(28px,5vw,48px) 0;padding:24px 28px;border:1px solid var(--line);border-inline-start:3px solid var(--glow);border-radius:6px 18px 18px 6px;background:var(--panel);text-decoration:none;color:var(--ink);transition:transform .2s ease,border-color .2s ease}
html[dir="rtl"] .atlas{border-radius:18px 6px 6px 18px}
.atlas:hover,.atlas:focus-visible{border-color:var(--glow);transform:translateY(-2px)}
.atlas h3{margin:0 0 6px;font-family:"Cormorant Garamond","Times New Roman",serif;font-size:1.7rem;line-height:1.2;direction:ltr;unicode-bidi:isolate;text-align:start}
.atlas p{margin:0 0 8px;color:var(--muted);max-width:56ch}
.atlas .url{font-size:.85rem;color:var(--ice);direction:ltr;unicode-bidi:isolate;display:inline-block}
.space-note{margin:28px 0 0;font-family:var(--display);font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1.35;color:var(--ice);max-width:50ch}
html[lang="ar"] .space-note{line-height:1.7}
@media (max-width:820px){.space-head{grid-template-columns:minmax(0,1fr)}.orbit svg{max-width:300px}}

/* ===== device adaptive / app mode ===== */
:root{--hdr:rgba(7,21,36,.74)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--hdr:rgba(238,248,253,.82)}}
:root[data-theme="light"]{--hdr:rgba(238,248,253,.82)}
:root[data-theme="dark"]{--hdr:rgba(7,21,36,.74)}
@supports not (overflow-x:clip){html{overflow-x:hidden}body{overflow-x:visible}}
html{-webkit-text-size-adjust:100%}
a,button,select{touch-action:manipulation}
body{-webkit-tap-highlight-color:transparent}
html[data-mode="standalone"] body{overscroll-behavior-y:contain}
section,#home{scroll-margin-top:72px}
#progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,#9fe3ff,#4cc9f0,#a78bfa);pointer-events:none}
html[dir="rtl"] #progress{transform-origin:100% 50%}
nav a{position:relative;padding:6px 0}
nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:2px;background:var(--glow);transform:scaleX(0);transition:transform .25s ease}
nav a.active{color:var(--ink)}
nav a.active::after{transform:scaleX(1)}
.install{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.9rem;font-weight:500;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--glow);background:transparent;color:var(--ice);cursor:pointer}
.install[hidden]{display:none}
.install svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.install:hover{background:rgba(76,201,240,.12)}
.tabbar{display:none}
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,10,20,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet[hidden]{display:none}
.sheet-card{width:min(520px,100%);background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:26px 24px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .28s ease}
.sheet-card h3{margin:0 0 8px;font-family:var(--display);font-size:1.8rem;line-height:1.2}
.sheet-card p{color:var(--muted);margin:0 0 22px}
.sheet-card .btn{border:0;font:inherit;font-weight:600;cursor:pointer;width:100%;display:block;text-align:center}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.art{transition:transform .25s ease;will-change:transform}
html[data-perf="low"] .aurora{filter:none}
html[data-perf="low"] .art-inner{animation:none}
html[data-perf="low"] header,html[data-perf="low"] .tabbar{-webkit-backdrop-filter:none;backdrop-filter:none}
@media (pointer:coarse){.btn,.copy,select,.install{min-height:44px}}
@media (min-width:821px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
@media (max-width:820px){
  body{padding-bottom:64px}
  .bar{min-height:56px;justify-content:flex-start;gap:10px}
  .mark{font-size:1.2rem}
  .install{margin-inline-start:auto;padding:0;width:40px;height:40px;justify-content:center}
  .install span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .install[hidden]+select{margin-inline-start:auto}
  .bar select{margin-inline-start:0}
  .wrap{padding-inline:18px}
  section{padding:44px 0}
  .hero{padding:20px 0 36px}
  .art{border-radius:18px}
  .hero .btn,.join .btn,.atlas .btn{display:block;width:100%;text-align:center}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--hdr);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 2px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:500;border-radius:14px}
  .tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.active{color:var(--ice)}
  .tabbar a.active::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--glow)}
  .tabbar a:active{background:var(--panel)}
}

  var SP={"en": {"nav_space": "Space", "space_h": "Satellites, space and operations monitoring", "space_p": "Orbiting satellites see what a road or a port cannot: a snowstorm forming days away, ice closing a shipping lane, a front moving toward a freight hub. Archipelago uses this view from space to keep logistics support moving around the world 🌏.", "atlas_d": "An interactive 3D globe with regions, layers and statistics, for following operations across the world in one view.", "atlas_btn": "Open the atlas", "s1_t": "Weather watched from orbit", "s1_d": "Geostationary satellites photograph the same region every few minutes, while polar-orbiting satellites pass over in finer detail. Together they show where a snowstorm forms, how fast it moves and how strong it is.", "s2_t": "Snow, ice and low visibility", "s2_d": "Radar and microwave sensors work through cloud and in the dark. They map snow cover and sea ice, and show where ports, passes and shipping lanes are at risk of freezing or closing.", "s3_t": "Knowing where every shipment is", "s3_d": "Satellite positioning and ship-tracking signals place each vessel, truck and container on the map, so a storm can be matched to the cargo in its path.", "s4_t": "Acting before the storm arrives", "s4_d": "With early warning, teams reroute, shift schedules, move stock ahead of time and alert drivers and crews, so a storm delays a shipment by hours instead of stopping the chain.", "space_note": "Satellites cannot stop a snowstorm, but they give early notice, and that notice keeps support moving."}, "ru": {"nav_space": "Космос", "space_h": "Спутники, космос и мониторинг работы", "space_p": "Спутники на орбите видят то, что не видно с дороги или из порта: снежную бурю, зарождающуюся за много дней пути, лёд, перекрывающий морской путь, фронт, идущий к грузовому узлу. Archipelago использует этот взгляд из космоса, чтобы логистическая поддержка не прерывалась по всему миру 🌏.", "atlas_d": "Интерактивный 3D-глобус с регионами, слоями и статистикой — чтобы следить за работой по всему миру в одном окне.", "atlas_btn": "Открыть атлас", "s1_t": "Погода под наблюдением с орбиты", "s1_d": "Геостационарные спутники снимают один и тот же район каждые несколько минут, а полярно-орбитальные пролетают над ним с более высокой детализацией. Вместе они показывают, где зарождается снежная буря, как быстро она движется и насколько сильна.", "s2_t": "Снег, лёд и плохая видимость", "s2_d": "Радиолокационные и микроволновые датчики работают сквозь облака и в темноте. Они картируют снежный покров и морской лёд и показывают, где порты, перевалы и морские пути могут замёрзнуть или закрыться.", "s3_t": "Знать, где каждый груз", "s3_d": "Спутниковое позиционирование и сигналы слежения за судами помещают каждое судно, грузовик и контейнер на карту, поэтому бурю можно сопоставить с грузами на её пути.", "s4_t": "Действовать до прихода бури", "s4_d": "Получив раннее предупреждение, команды меняют маршруты, сдвигают графики, заранее перемещают запасы и предупреждают водителей и экипажи — и буря задерживает груз на часы, а не останавливает всю цепочку.", "space_note": "Спутники не могут остановить снежную бурю, но заранее предупреждают о ней, а это позволяет поддержке работать без перебоев."}, "de": {"nav_space": "Weltraum", "space_h": "Satelliten, Weltraum und Betriebsüberwachung", "space_p": "Satelliten im Orbit sehen, was von einer Straße oder einem Hafen aus verborgen bleibt: einen Schneesturm, der sich Tage entfernt bildet, Eis, das einen Schifffahrtsweg blockiert, eine Front auf dem Weg zu einem Frachtknoten. Archipelago nutzt diesen Blick aus dem All, damit die Logistikunterstützung weltweit in Bewegung bleibt 🌏.", "atlas_d": "Ein interaktiver 3D-Globus mit Regionen, Ebenen und Statistiken, um den Betrieb weltweit in einer Ansicht zu verfolgen.", "atlas_btn": "Atlas öffnen", "s1_t": "Wetter aus dem Orbit im Blick", "s1_d": "Geostationäre Satelliten fotografieren dieselbe Region alle paar Minuten, polarumlaufende Satelliten überfliegen sie mit feinerer Auflösung. Zusammen zeigen sie, wo ein Schneesturm entsteht, wie schnell er zieht und wie stark er ist.", "s2_t": "Schnee, Eis und schlechte Sicht", "s2_d": "Radar- und Mikrowellensensoren arbeiten durch Wolken und im Dunkeln. Sie kartieren Schneedecke und Meereis und zeigen, wo Häfen, Pässe und Schifffahrtswege zufrieren oder gesperrt werden könnten.", "s3_t": "Wissen, wo jede Sendung ist", "s3_d": "Satellitenortung und Schiffsverfolgungssignale legen jedes Schiff, jeden Lkw und jeden Container auf die Karte, sodass sich ein Sturm der Fracht in seinem Weg zuordnen lässt.", "s4_t": "Handeln, bevor der Sturm kommt", "s4_d": "Mit Frühwarnung leiten Teams um, verschieben Zeitpläne, bewegen Bestände vorab und warnen Fahrer und Besatzungen – so verzögert ein Sturm eine Lieferung um Stunden, statt die Kette zu stoppen.", "space_note": "Satelliten können keinen Schneesturm aufhalten, aber sie warnen früh – und diese Vorwarnzeit hält die Unterstützung in Bewegung."}, "fr": {"nav_space": "Espace", "space_h": "Satellites, espace et suivi des opérations", "space_p": "Les satellites en orbite voient ce qu’une route ou un port ne peut pas voir : une tempête de neige qui se forme à plusieurs jours de distance, de la glace qui ferme une voie maritime, un front qui avance vers un hub de fret. Archipelago s’appuie sur cette vue depuis l’espace pour que le support logistique continue d’avancer dans le monde entier 🌏.", "atlas_d": "Un globe 3D interactif avec régions, calques et statistiques, pour suivre les opérations dans le monde depuis une seule vue.", "atlas_btn": "Ouvrir l’atlas", "s1_t": "La météo surveillée depuis l’orbite", "s1_d": "Les satellites géostationnaires photographient la même région toutes les quelques minutes, tandis que les satellites à défilement la survolent avec plus de détail. Ensemble, ils montrent où se forme une tempête de neige, à quelle vitesse elle avance et quelle est sa force.", "s2_t": "Neige, glace et faible visibilité", "s2_d": "Les capteurs radar et micro-ondes fonctionnent à travers les nuages et dans l’obscurité. Ils cartographient le manteau neigeux et la glace de mer, et montrent où ports, cols et routes maritimes risquent de geler ou de fermer.", "s3_t": "Savoir où se trouve chaque envoi", "s3_d": "Le positionnement par satellite et les signaux de suivi des navires placent chaque navire, camion et conteneur sur la carte, ce qui permet de relier une tempête aux marchandises sur son chemin.", "s4_t": "Agir avant l’arrivée de la tempête", "s4_d": "Avec une alerte précoce, les équipes modifient les itinéraires, décalent les plannings, déplacent les stocks à l’avance et préviennent chauffeurs et équipages : la tempête retarde alors un envoi de quelques heures au lieu d’arrêter la chaîne.", "space_note": "Les satellites ne peuvent pas arrêter une tempête de neige, mais ils donnent l’alerte tôt, et ce préavis garde le support en mouvement."}, "it": {"nav_space": "Spazio", "space_h": "Satelliti, spazio e monitoraggio operativo", "space_p": "I satelliti in orbita vedono ciò che da una strada o da un porto non si vede: una tempesta di neve che si forma a giorni di distanza, il ghiaccio che chiude una rotta marittima, un fronte diretto verso un hub merci. Archipelago usa questa vista dallo spazio per mantenere in movimento il supporto logistico in tutto il mondo 🌏.", "atlas_d": "Un globo 3D interattivo con regioni, livelli e statistiche, per seguire le operazioni nel mondo in un’unica vista.", "atlas_btn": "Apri l’atlante", "s1_t": "Il meteo osservato dall’orbita", "s1_d": "I satelliti geostazionari riprendono la stessa regione ogni pochi minuti, mentre quelli in orbita polare la sorvolano con maggiore dettaglio. Insieme mostrano dove nasce una tempesta di neve, quanto veloce si muove e quanto è intensa.", "s2_t": "Neve, ghiaccio e scarsa visibilità", "s2_d": "I sensori radar e a microonde funzionano attraverso le nuvole e al buio. Mappano il manto nevoso e il ghiaccio marino e mostrano dove porti, valichi e rotte marittime rischiano di gelare o chiudere.", "s3_t": "Sapere dov’è ogni spedizione", "s3_d": "Il posizionamento satellitare e i segnali di tracciamento delle navi collocano ogni nave, camion e container sulla mappa, così una tempesta può essere abbinata al carico sul suo percorso.", "s4_t": "Agire prima che arrivi la tempesta", "s4_d": "Con un preavviso, i team cambiano percorso, spostano gli orari, anticipano le scorte e avvisano autisti ed equipaggi: così una tempesta ritarda una spedizione di ore invece di fermare la catena.", "space_note": "I satelliti non possono fermare una tempesta di neve, ma la segnalano in anticipo, e quel preavviso mantiene il supporto in movimento."}, "no": {"nav_space": "Rommet", "space_h": "Satellitter, rommet og overvåking av drift", "space_p": "Satellitter i bane ser det en vei eller en havn ikke kan se: en snøstorm som danner seg flere dager unna, is som stenger en skipsled, en front på vei mot et fraktknutepunkt. Archipelago bruker dette utsynet fra rommet for å holde logistikkstøtten i gang over hele verden 🌏.", "atlas_d": "En interaktiv 3D-globus med regioner, lag og statistikk, for å følge driften over hele verden i ett bilde.", "atlas_btn": "Åpne atlaset", "s1_t": "Været overvåket fra bane", "s1_d": "Geostasjonære satellitter fotograferer samme område hvert få minutt, mens polarbanesatellitter flyr over med mer detaljer. Sammen viser de hvor en snøstorm oppstår, hvor raskt den beveger seg og hvor kraftig den er.", "s2_t": "Snø, is og dårlig sikt", "s2_d": "Radar- og mikrobølgesensorer fungerer gjennom skyer og i mørket. De kartlegger snødekke og havis og viser hvor havner, fjellpass og skipsleder står i fare for å fryse til eller stenge.", "s3_t": "Vite hvor hver forsendelse er", "s3_d": "Satellittposisjonering og signaler for skipssporing plasserer hvert skip, hver lastebil og hver container på kartet, slik at en storm kan knyttes til lasten i veien.", "s4_t": "Handle før stormen kommer", "s4_d": "Med tidlig varsling endrer team ruter, flytter tidsplaner, flytter lager i forkant og varsler sjåfører og mannskap – slik at en storm forsinker en forsendelse med timer i stedet for å stanse kjeden.", "space_note": "Satellitter kan ikke stoppe en snøstorm, men de gir tidlig varsel, og det varselet holder støtten i gang."}, "ar": {"nav_space": "الفضاء", "space_h": "الأقمار الصناعية والفضاء ومراقبة العمل", "space_p": "ترى الأقمار الصناعية في مدارها ما لا يراه الطريق ولا الميناء: عاصفة ثلجية تتشكل على بعد أيام، وجليدًا يغلق ممرًا بحريًا، وجبهة جوية تتجه نحو مركز شحن. يعتمد ارخبيل على هذه الرؤية من الفضاء ليبقى الدعم اللوجستي متحركًا في جميع أنحاء العالم 🌏.", "atlas_d": "كرة أرضية ثلاثية الأبعاد تفاعلية فيها المناطق والطبقات والإحصائيات، لمتابعة العمل حول العالم في شاشة واحدة.", "atlas_btn": "افتح الأطلس", "s1_t": "الطقس تحت المراقبة من المدار", "s1_d": "تلتقط الأقمار الثابتة بالنسبة للأرض صورًا للمنطقة نفسها كل بضع دقائق، بينما تمر الأقمار القطبية فوقها بتفاصيل أدق. وبهما معًا نعرف أين تتشكل العاصفة الثلجية، وبأي سرعة تتحرك، وما مدى قوتها.", "s2_t": "الثلج والجليد وضعف الرؤية", "s2_d": "تعمل مستشعرات الرادار والموجات الدقيقة عبر الغيوم وفي الظلام. ترسم خرائط للغطاء الثلجي والجليد البحري، وتُظهر أين تتعرض الموانئ والممرات الجبلية والمسارات البحرية لخطر التجمد أو الإغلاق.", "s3_t": "معرفة مكان كل شحنة", "s3_d": "يحدد التموضع بالأقمار الصناعية وإشارات تتبع السفن مكان كل سفينة وشاحنة وحاوية على الخريطة، فنربط العاصفة بالبضائع التي تقف في طريقها.", "s4_t": "التحرك قبل وصول العاصفة", "s4_d": "مع الإنذار المبكر تغيّر الفرق المسارات، وتعدّل الجداول، وتنقل المخزون مسبقًا، وتنبّه السائقين والطواقم، فتؤخر العاصفة الشحنة ساعات بدل أن توقف السلسلة كلها.", "space_note": "لا تستطيع الأقمار الصناعية إيقاف عاصفة ثلجية، لكنها تمنحنا إنذارًا مبكرًا، وهذا الإنذار يُبقي الدعم متحركًا."}};

  function detect(){

    var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||navigator.userLanguage];

    if(ul){ul.textContent="";[LON[l],region(l,"CH"),region(l,"CA"),region(l,"US"),region(l,"NO")].forEach(function(n){var li=document.createElement("li");li.textContent=n;ul.appendChild(li);});}
    var ib=document.getElementById("installBtn");if(ib)ib.setAttribute("aria-label",d.inst_btn);

  var sel=document.getElementById("lang");
  order.forEach(function(k){ var o=document.createElement("option"); o.value=k; o.textContent=T[k].label; sel.appendChild(o); });
  sel.addEventListener("change",function(){
    try{ localStorage.setItem("arch_lang",sel.value); }catch(e){}
    apply(sel.value);
  });
  apply(detect());

  // EU flag
  var f=document.getElementById("euflag"), ns="http://www.w3.org/2000/svg";
  var r=document.createElementNS(ns,"rect"); r.setAttribute("width",30); r.setAttribute("height",20); r.setAttribute("fill","#003399"); f.appendChild(r);
  for(var i=0;i<12;i++){
    var a=i/12*Math.PI*2, c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",(15+6.2*Math.sin(a)).toFixed(2)); c.setAttribute("cy",(10-6.2*Math.cos(a)).toFixed(2));
    c.setAttribute("r",1); c.setAttribute("fill","#ffcc00"); f.appendChild(c);
  }

  // snow
  var cv=document.getElementById("snow"), ctx=cv.getContext&&cv.getContext("2d");
  if(ctx && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    var W,H,flakes=[],dpr=Math.min(window.devicePixelRatio||1,2);
    function size(){ W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0); }
    size(); addEventListener("resize",size);
    var ds=document.documentElement.dataset,N=ds.perf==="low"?20:(ds.device==="phone"?38:80);for(var k=0;k<N;k++) flakes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.5,v:Math.random()*.5+.2,s:Math.random()*Math.PI*2});
    (function tick(){
      ctx.clearRect(0,0,W,H);
      var dark=!(getComputedStyle(document.body).backgroundColor.match(/\d+/g)||[0,0,0]).every(function(n,i){return i>2||n>150});
      ctx.fillStyle=dark?"rgba(220,245,255,.7)":"rgba(28,134,184,.5)";
      flakes.forEach(function(p){
        p.y+=p.v; p.s+=.01; p.x+=Math.sin(p.s)*.3;
        if(p.y>H+4){p.y=-4;p.x=Math.random()*W}
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
      });
      requestAnimationFrame(tick);
    })();
  }
})();
</script>

<script>
(function(){
  var h=document.documentElement, T=window.__T||{};
  /* active section */
  var links=document.querySelectorAll('nav a[href^="#"]');
  function setActive(id){
    links.forEach(function(a){
      var t=a.getAttribute("href").slice(1), tab=!!a.closest(".tabbar");
      var on=(t===id)||(tab&&t==="about"&&id==="focus");
      a.classList.toggle("active",on);
      if(on)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current");
    });
  }
  setActive("home");
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setActive(e.target.id);});},{rootMargin:"-40% 0px -55% 0px"});
    ["home","about","focus","space","team"].forEach(function(id){var el=document.getElementById(id);if(el)io.observe(el);});
  }
  /* progress bar */
  var pr=document.getElementById("progress"),tick=false;
  function prog(){tick=false;var m=document.documentElement.scrollHeight-innerHeight;pr.style.transform="scaleX("+(m>0?Math.min(1,scrollY/m):0)+")";}
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(prog);}},{passive:true});prog();
  /* haptics on tab tap */
  document.querySelector(".tabbar").addEventListener("click",function(){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}});
  /* install flow */
  var btn=document.getElementById("installBtn"),sheet=document.getElementById("sheet"),sp=document.getElementById("sheetP"),sc=document.getElementById("sheetClose"),dp=null,last=null;
  if(h.dataset.mode!=="standalone")btn.hidden=false;
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;});
  addEventListener("appinstalled",function(){btn.hidden=true;});
  function openSheet(){
    var d=(window.__T||{})[h.lang]||{},k=h.dataset.os==="ios"?"inst_ios":(h.dataset.os==="android"?"inst_android":"inst_desk");
    sp.textContent=d[k]||"";last=document.activeElement;sheet.hidden=false;sc.focus();
  }
  function closeSheet(){sheet.hidden=true;if(last&&last.focus)last.focus();}
  btn.addEventListener("click",function(){
    if(dp){dp.prompt();dp.userChoice.then(function(){dp=null;},function(){dp=null;});return;}
    openSheet();
  });
  sc.addEventListener("click",closeSheet);
  sheet.addEventListener("click",function(e){if(e.target===sheet)closeSheet();});
  addEventListener("keydown",function(e){if(e.key==="Escape"&&!sheet.hidden)closeSheet();});
  /* pointer-fine tilt on hero art */
  var art=document.querySelector(".art");
  if(art&&matchMedia("(pointer:fine)").matches&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    art.addEventListener("pointermove",function(e){
      var r=art.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      art.style.transform="perspective(900px) rotateY("+(x*6)+"deg) rotateX("+(-y*6)+"deg)";
    });
    art.addEventListener("pointerleave",function(){art.style.transform="";});
  }
})();
</script>
